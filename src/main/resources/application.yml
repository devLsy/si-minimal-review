server:
  port: 8080
  servlet:
    session:
      timeout: 0

file.path: D:/upload/si-core_v1/

mybatis:
  mapper-locations: mapper/**/*.xml
  type-aliases-package: com.lsy.sicore_v1.*
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: VARCHAR

spring:
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB
      enabled: true

  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=localhost)(PORT=1521))(LOAD_BALANCE=ON)(CONNECT_DATA=(SERVER=DEDICATED)(SERVICE_NAME=ORCL)))
    hikari:
      username: DEV_01
      password: 1234
      connection-timeout: 60000
      auto-commit: false

  thymeleaf:
    cache: false


