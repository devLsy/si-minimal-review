<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>My Admin System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #2c3e50; color: #fff; padding: 20px; flex-shrink: 0; }
        .sidebar .nav-link { color: #bdc3c7; padding: 10px; text-decoration: none; display: block; }
        .sidebar .nav-link:hover { background: #34495e; color: #fff; border-radius: 5px; }
        .parent-menu { font-weight: bold; color: #f1c40f; margin-top: 20px; display: block; font-size: 1.1rem; }
        .sub-menu { padding-left: 15px; list-style: none; margin-top: 5px; }
        .content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .card { border: none; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar shadow">
            <h3 class="text-center mb-4">🚀 My Admin</h3>
            <hr>
            <ul class="nav flex-column">
                <li th:each="parent : ${menuList}">
                    <span class="parent-menu" th:text="${parent.menuName}">대메뉴</span>
                    <ul class="sub-menu">
                        <li th:each="child : ${parent.children}">
                            <a class="nav-link" th:href="${child.menuUrl}" th:text="${child.menuName}">중메뉴</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
        <main class="content">
            <div layout:fragment="content"></div>
        </main>
    </div>
</body>
</html>
